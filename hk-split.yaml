proxy-groups:
- name: 📺 流媒体
  type: select
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
- name: 🤖 AI
  type: select
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
- name: 📈 TradingView
  type: select
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
- name: 🇭🇰 香港受限
  type: select
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
- name: 🚀 兜底代理
  type: select
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
rule-providers:
  hrules-private-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/hcloudlab/Hrules/main/mihomo/scenes/private_direct.yaml
    path: ./providers/private_direct.yaml
    interval: 21600
  hrules-cn-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/hcloudlab/Hrules/main/mihomo/scenes/cn_direct.yaml
    path: ./providers/cn_direct.yaml
    interval: 21600
  hrules-cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./providers/hrules-cn-ip.mrs
    interval: 21600
  hrules-general-ai:
