rules:
- RULE-SET,hrules-private-direct,DIRECT,no-resolve
- RULE-SET,hrules-cn-direct,DIRECT
- RULE-SET,hrules-cn-ip,DIRECT,no-resolve
- DOMAIN-SUFFIX,tradingview.com,📈 TradingView
- RULE-SET,hrules-general-ai,🤖 AI
- RULE-SET,hrules-sensitive-ai,🤖 AI
- RULE-SET,hrules-crypto-account,🇭🇰 香港受限
- RULE-SET,hrules-brokerage-account,🇭🇰 香港受限
- RULE-SET,hrules-financial-account,🇭🇰 香港受限
- RULE-SET,hrules-us-banking-account,🇭🇰 香港受限
- DOMAIN-SUFFIX,mql5.com,🇭🇰 香港受限
- DOMAIN-SUFFIX,metaquotes.net,🇭🇰 香港受限
- DOMAIN-SUFFIX,metaquotes.com,🇭🇰 香港受限
- DOMAIN-SUFFIX,awsglobalaccelerator.com,🇭🇰 香港受限
- RULE-SET,hrules-streaming-media,📺 流媒体
- RULE-SET,hrules-youtube-media,📺 流媒体
- RULE-SET,hrules-mainstream-proxy,📺 流媒体
- MATCH,🚀 兜底代理
